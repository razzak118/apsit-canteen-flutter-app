name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Add Android internet permission
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          if not path.exists():
              raise SystemExit(f"Android manifest not found: {path}")

          text = path.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.INTERNET' not in text:
              match = re.search(r"(?m)^([ \t]*)<application\b", text)
              if not match:
                  raise SystemExit("Could not find <application> in AndroidManifest.xml")
              indent = match.group(1)
              text = text[:match.start()] + indent + permission + "\n" + text[match.start():]
              path.write_text(text)
          print("Android INTERNET permission is present")
          PYCODE

      - name: Enable core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              path = kts
              is_kotlin_dsl = True
              enabled_line = "isCoreLibraryDesugaringEnabled = true"
              dependency_line = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          elif groovy.exists():
              path = groovy
              is_kotlin_dsl = False
              enabled_line = "coreLibraryDesugaringEnabled true"
              dependency_line = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          else:
              raise SystemExit("Android Gradle file was not generated")

          text = path.read_text()

          # Enable desugaring inside the app's compileOptions block.
          if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
              match = re.search(r"(?m)^([ \t]*)compileOptions\s*\{", text)
              if not match:
                  raise SystemExit(f"Could not find compileOptions block in {path}")
              indent = match.group(1) + "    "
              text = text[:match.end()] + "\n" + indent + enabled_line + text[match.end():]

          # Add the desugaring library to an existing dependencies block, or
          # create a new top-level dependencies block if this template has none.
          if "coreLibraryDesugaring" not in text:
              match = re.search(r"(?m)^([ \t]*)dependencies\s*\{", text)
              if match:
                  indent = match.group(1) + "    "
                  text = text[:match.end()] + "\n" + indent + dependency_line + text[match.end():]
              else:
                  if is_kotlin_dsl:
                      new_block = f"\n\ndependencies {{\n    {dependency_line}\n}}\n"
                  else:
                      new_block = f"\n\ndependencies {{\n    {dependency_line}\n}}\n"
                  text = text.rstrip() + new_block

          path.write_text(text)
          print(f"Enabled core library desugaring in {path}")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
